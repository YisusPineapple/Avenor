name: Build Avenor Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gradle_task: :desktop:packageDeb
            artifact_name: avenor-linux-deb
            artifact_path: desktop/build/compose/binaries/main/deb/*.deb
          - os: windows-latest
            gradle_task: :desktop:packageMsi
            artifact_name: avenor-windows-msi
            artifact_path: desktop/build/compose/binaries/main/msi/*.msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew
        continue-on-error: true

      - name: Build Desktop Package
        run: ./gradlew ${{ matrix.gradle_task }} --no-daemon --max-workers=2

      - name: Upload Desktop Installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
