name: Build Avenor

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        continue-on-error: true

      # Offload build workloads without a powerful local machine by using Gradle parallel limits
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --max-workers=2 -Pkotlin.daemon.jvm.options="-Xmx2048M"
        
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: avenor-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  # NOTE: To sign the release APK, you must generate a keystore and add it to GitHub Secrets
  # See the README.md for instructions on how to generate and configure the Keystore.
  build-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --max-workers=2
        
      # To enable automated signing, uncomment and configure the following step:
      # - name: Sign APK
      #   uses: r0adkll/sign-android-release@v1
      #   with:
      #     releaseDirectory: app/build/outputs/apk/release
      #     signingKeyBase64: ${{ secrets.SIGNING_KEY }}
      #     alias: ${{ secrets.KEY_ALIAS }}
      #     keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
      #     keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: avenor-release-apk
          path: app/build/outputs/apk/release/*.apk
