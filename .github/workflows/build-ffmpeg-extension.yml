name: Build Media3 FFmpeg Extension (Audiophile Decoders)

on:
  workflow_dispatch:

jobs:
  build-ffmpeg-aar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android NDK (r26b)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make cmake ninja-build yasm nasm pkg-config

      - name: Clone Media3 (v1.2.1) and FFmpeg (release/6.0)
        run: |
          git clone --depth 1 -b 1.2.1 https://github.com/androidx/media.git
          cd media/libraries/decoder_ffmpeg/src/main/jni
          git clone --depth 1 --branch release/6.0 https://github.com/FFmpeg/FFmpeg.git ffmpeg

      - name: Build FFmpeg native libraries (arm64-v8a & armeabi-v7a)
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd media
          export FFMPEG_MODULE_PATH="$(pwd)/libraries/decoder_ffmpeg/src/main"
          export HOST_PLATFORM="linux-x86_64"
          export ANDROID_ABI=26
          export ENABLED_DECODERS=(alac ape flac wavpack eac3 ac3 truehd dca opus)

          cd "${FFMPEG_MODULE_PATH}/jni"
          chmod +x build_ffmpeg.sh

          # Restrict ABI targets in build_ffmpeg.sh & Gradle to arm64-v8a and armeabi-v7a
          sed -i '/x86/d' "${FFMPEG_MODULE_PATH}/../build.gradle" || true
          if grep -q "ndk {" "${FFMPEG_MODULE_PATH}/../build.gradle"; then
            true
          else
            sed -i '/defaultConfig {/a \        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }' "${FFMPEG_MODULE_PATH}/../build.gradle"
          fi

          ./build_ffmpeg.sh \
            "${FFMPEG_MODULE_PATH}" \
            "${NDK_PATH}" \
            "${HOST_PLATFORM}" \
            "${ANDROID_ABI}" \
            "${ENABLED_DECODERS[@]}"

      - name: Assemble Media3 FFmpeg Decoder AAR
        run: |
          cd media
          chmod +x gradlew
          ./gradlew lib-decoder-ffmpeg:assembleRelease --no-daemon --max-workers=2

      - name: Upload Media3 FFmpeg Extension AAR
        uses: actions/upload-artifact@v4
        with:
          name: media3-ffmpeg-extension
          path: media/libraries/decoder_ffmpeg/buildout/outputs/aar/*.aar
          if-no-files-found: error
